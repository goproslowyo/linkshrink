[package]
name = "linkshrink"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "go/ links: keyword -> URL redirects behind the Kanidm gate"

[dependencies]
arc-swap = "1"
askama = "0.16"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
percent-encoding = "2"
mimalloc = { version = "0.1", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
